name: Bug Report
description: 回報實際出錯的行為（卡住、結果錯亂、CI red、worker crash 等）
title: "bug(<scope>): "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        若這是 app 自動生成的 issue，`Channel / Reporter / Branch` 通常會在最上方。手動建立時不必填。
        中英文皆可，混寫亦可。表格與 `- [ ]` 自由使用。

  - type: textarea
    id: problem
    attributes:
      label: 問題現象
      description: 觀察到什麼？期望是什麼？兩者差在哪？
      placeholder: |
        實際行為：…
        期望行為：…
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 重現步驟
      placeholder: |
        1. ...
        2. ...
        3. ...

  - type: textarea
    id: root_cause
    attributes:
      label: 根因分析
      description: 若已知，請描述程式碼路徑、觸發條件、為什麼會這樣。可空。
      placeholder: |
        錯誤鏈：
        1. `pkg/foo.go:Bar` 在 X 條件下 …
        2. …

  - type: textarea
    id: impact
    attributes:
      label: 影響
      description: Blast radius、誰會受影響、是否阻塞 release。
      placeholder: |
        - …
        - …

  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: log 片段、pod name、commit hash、時間戳。Slack 截圖也可。
      render: text

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: 修好後要能驗證的條件。預設三個空項目，按需增減。
      value: |
        - [ ]
        - [ ]
        - [ ]

  - type: input
    id: related
    attributes:
      label: Related issues / PRs
      placeholder: "Fixes #N / Refs #N / Blocks #N"
