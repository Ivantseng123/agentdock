name: Refactor / Tech Debt
description: 內部清理、結構調整、命名修正等非功能性改動
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Title 建議用 `refactor(<scope>): …` 格式（非強制）。常見 scope：`worker`、`queue`、`config`、`workflow`、`shared`、`app`。
        對齊 repo 已存在的 refactor issue（例 #101 / #102 / #110 / #114 / #126）。
        若會牽動 `app/` `worker/` `shared/` 之間的 import 邊界，請特別在「改動建議」中說明。

  - type: textarea
    id: current
    attributes:
      label: 現狀
      description: 目前長什麼樣、為什麼想動。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 改動建議
      description: 預期動到哪些檔案 / package；若影響 module 邊界請點明。
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 驗證方式
      placeholder: |
        go build ./...
        go test ./... -race
        go test ./test/... -run TestImportDirection

  - type: input
    id: related
    attributes:
      label: Related
      placeholder: "Refs #N / Part of #N"
